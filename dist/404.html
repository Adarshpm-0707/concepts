<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Aleef Concepts</title>
    <script type="text/javascript">
      // SPA 404 fallback redirect for GitHub Pages / static hosting
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + (l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/')) + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
